name: Build Zamik (macOS AU + VST3)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Use Xcode 16 (the newest that still builds for macOS 10.13)
        run: |
          X=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version

      - name: Install Ninja
        run: brew install ninja || true

      - name: "Configure (universal: Apple silicon + Intel, macOS 10.13 High Sierra and later)"
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Build
        run: cmake --build build --target Zamik_AU Zamik_VST3 Zamik_Standalone ZamikTests -j 4

      - name: Bit-transparency tests
        run: ./build/ZamikTests_artefacts/Release/ZamikTests

      - name: Check High Sierra compatibility (Intel part must say macOS 10.13)
        run: |
          A=build/Zamik_artefacts/Release
          fail=0
          for bin in "$A/AU/Zamik.component/Contents/MacOS/Zamik" "$A/VST3/Zamik.vst3/Contents/MacOS/Zamik" "$A/Standalone/Zamik.app/Contents/MacOS/Zamik"; do
            echo "== $bin"
            lipo -info "$bin"
            v=$(otool -arch x86_64 -l "$bin" | awk '/LC_VERSION_MIN_MACOSX/{f=1} /LC_BUILD_VERSION/{f=2} f==1&&/version/{print $2; exit} f==2&&/minos/{print $2; exit}')
            echo "x86_64 minimum macOS: $v"
            [ "$v" = "10.13" ] || fail=1
          done
          for plist in "$A/AU/Zamik.component/Contents/Info.plist" "$A/VST3/Zamik.vst3/Contents/Info.plist"; do
            m=$(/usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$plist" 2>/dev/null || echo "not set")
            echo "$plist LSMinimumSystemVersion: $m"
            case "$m" in 10.13*|"not set") ;; *) fail=1 ;; esac
          done
          exit $fail

      - name: Sign (ad hoc)
        run: |
          A=build/Zamik_artefacts/Release
          codesign --force --deep --sign - "$A/AU/Zamik.component"
          codesign --force --deep --sign - "$A/VST3/Zamik.vst3"
          codesign --force --deep --sign - "$A/Standalone/Zamik.app"

      - name: Validate the Audio Unit with auval
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/Zamik_artefacts/Release/AU/Zamik.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -a | grep -i zmk || true
          auval -strict -v aufx Zmk1 Zmka

      - name: Validate with pluginval (VST3 and AU)
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process --skip-gui-tests build/Zamik_artefacts/Release/VST3/Zamik.vst3
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process --skip-gui-tests ~/Library/Audio/Plug-Ins/Components/Zamik.component

      - name: Open the plugin window (pluginval interface tests)
        continue-on-error: true
        run: ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate-in-process build/Zamik_artefacts/Release/VST3/Zamik.vst3

      - name: Interface snapshots
        continue-on-error: true
        run: |
          mkdir -p ui
          ./build/ZamikTests_artefacts/Release/ZamikTests ui

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-snapshots
          path: ui/*.png
          if-no-files-found: ignore

      - name: Build the installer (.pkg)
        run: |
          set -e
          A=build/Zamik_artefacts/Release
          VER=$(sed -n 's/^project(Zamik VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "version $VER"
          mkdir -p pkgroot/au pkgroot/vst3 pkgs res dist
          cp -R "$A/AU/Zamik.component" pkgroot/au/
          cp -R "$A/VST3/Zamik.vst3" pkgroot/vst3/
          # Install exactly where we say, never into another copy found elsewhere on the disk,
          # and always replace an existing Zamik, whatever its version.
          for k in au:Zamik.component vst3:Zamik.vst3; do
            name=${k%%:*}; bundle=${k#*:}
            printf '%s\n' \
              '<?xml version="1.0" encoding="UTF-8"?>' \
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
              '<plist version="1.0"><array><dict>' \
              '<key>BundleHasStrictIdentifier</key><true/>' \
              '<key>BundleIsRelocatable</key><false/>' \
              '<key>BundleIsVersionChecked</key><false/>' \
              '<key>BundleOverwriteAction</key><string>upgrade</string>' \
              "<key>RootRelativeBundlePath</key><string>$bundle</string>" \
              '</dict></array></plist>' > "comp-$name.plist"
            plutil -lint "comp-$name.plist"
          done
          pkgbuild --root pkgroot/au --component-plist comp-au.plist --identifier com.zamikaudio.zamik.au \
                   --version "$VER" --install-location /Library/Audio/Plug-Ins/Components \
                   --scripts installer/scripts pkgs/Zamik-AU.pkg
          pkgbuild --root pkgroot/vst3 --component-plist comp-vst3.plist --identifier com.zamikaudio.zamik.vst3 \
                   --version "$VER" --install-location /Library/Audio/Plug-Ins/VST3 pkgs/Zamik-VST3.pkg
          sed "s/__VERSION__/$VER/g" installer/distribution.xml > distribution.xml
          for f in installer/resources/*.html; do sed "s/__VERSION__/$VER/g" "$f" > "res/$(basename "$f")"; done
          productbuild --distribution distribution.xml --resources res --package-path pkgs dist/Zamik-Installer.pkg
          pkgutil --payload-files dist/Zamik-Installer.pkg | grep -E "Zamik\.(component|vst3)/Contents/MacOS/Zamik$"

      - name: Test the installer on this Mac
        run: |
          set -e
          rm -rf ~/Library/Audio/Plug-Ins/Components/Zamik.component ~/Library/Audio/Plug-Ins/VST3/Zamik.vst3
          # pretend it was downloaded, as it will be for your friends
          xattr -w com.apple.quarantine "0081;$(printf %x "$(date +%s)");Safari;" dist/Zamik-Installer.pkg
          sudo installer -pkg dist/Zamik-Installer.pkg -target /
          ls -la /Library/Audio/Plug-Ins/Components/Zamik.component /Library/Audio/Plug-Ins/VST3/Zamik.vst3
          for p in /Library/Audio/Plug-Ins/Components/Zamik.component /Library/Audio/Plug-Ins/VST3/Zamik.vst3; do
            if xattr -r "$p" | grep -q quarantine; then echo "QUARANTINED: $p"; exit 1; else echo "not quarantined: $p"; fi
            codesign --verify --deep --strict "$p" && echo "signature ok: $p"
          done
          killall -9 AudioComponentRegistrar || true
          auval -strict -v aufx Zmk1 Zmka

      - name: Package
        run: |
          A=build/Zamik_artefacts/Release
          mkdir -p dist/Zamik-Installer
          cp dist/Zamik-Installer.pkg "installer/How to open the installer.txt" dist/Zamik-Installer/
          (cd dist && ditto -c -k --keepParent Zamik-Installer Zamik-Installer-macOS.zip)
          mkdir -p dist/Zamik
          cp -R "$A/AU/Zamik.component" "$A/VST3/Zamik.vst3" "$A/Standalone/Zamik.app" dist/Zamik/
          cp INSTALL.txt dist/Zamik/
          cd dist && ditto -c -k --keepParent Zamik Zamik-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Zamik-Installer-macOS
          path: dist/Zamik-Installer-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Zamik-macOS
          path: dist/Zamik-macOS.zip

      - name: Attach the zips to the release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Zamik-Installer-macOS.zip
            dist/Zamik-macOS.zip

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --target Zamik_VST3 ZamikTests --parallel

      - name: Bit-transparency tests
        run: ./build/ZamikTests_artefacts/Release/ZamikTests.exe

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/Zamik | Out-Null
          Copy-Item -Recurse build/Zamik_artefacts/Release/VST3/Zamik.vst3 dist/Zamik/
          Copy-Item INSTALL.txt dist/Zamik/
          Compress-Archive -Path dist/Zamik -DestinationPath dist/Zamik-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Zamik-Windows
          path: dist/Zamik-Windows.zip

      - name: Attach the zip to the release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Zamik-Windows.zip
